<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Itself</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
  :root {
    --ink: #0b0d10;
    --text: #8a9099;
    --text-dim: #4a4f57;
    --line: #1c2026;
    --safe-top: var(--tg-content-safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-right: var(--tg-content-safe-area-inset-right, env(safe-area-inset-right, 0px));
    --safe-bottom: var(--tg-content-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    --safe-left: var(--tg-content-safe-area-inset-left, env(safe-area-inset-left, 0px));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  body {
    min-height: 100dvh;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, monospace;
    color: var(--text);
  }
  canvas#world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: fixed;
    left: calc(16px + var(--safe-left));
    bottom: calc(16px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    user-select: none;
    -webkit-user-select: none;
  }
  .hud .title {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .hud .seedline {
    font-size: 11px;
    color: var(--text);
  }
  .hud .hint {
    font-size: 10px;
    color: var(--text-dim);
    max-width: 280px;
    line-height: 1.6;
  }
  .openline {
    display: flex;
    gap: 6px;
  }
  .openline input {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 7px 10px;
    width: 130px;
  }
  .openline input::placeholder { color: var(--text-dim); }
  .openline input:focus-visible { outline: 1px solid var(--text); outline-offset: 2px; }
  .openline input.bad { border-color: #b5604f; }

  /* The universe's genome — an attraction matrix */
  .genome {
    position: fixed;
    right: calc(16px + var(--safe-right));
    bottom: calc(16px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .genome canvas {
    image-rendering: pixelated;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .genome .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .controls {
    position: fixed;
    top: calc(16px + var(--safe-top));
    right: calc(16px + var(--safe-right));
    display: flex;
    gap: 8px;
  }
  button {
    appearance: none;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  button:hover { border-color: var(--text-dim); color: #c8cdd4; }
  button:focus-visible { outline: 1px solid var(--text); outline-offset: 2px; }

  @media (max-width: 600px) {
    .hud .hint { max-width: 200px; }
    .controls { top: calc(20px + var(--safe-top)); }
    html.telegram-mini-app .controls {
      top: max(calc(20px + var(--safe-top)), 112px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    /* the world moves by its very nature, but the interface does not */
    button { transition: none; }
  }
</style>
</head>
<body>

<canvas id="world"></canvas>

<div class="hud">
  <div class="title">Itself</div>
  <div class="seedline">law no. <span id="seed">—</span></div>
  <div class="openline">
    <input id="seedInput" type="text" inputmode="text" maxlength="8" spellcheck="false"
           placeholder="law number" aria-label="Law number">
    <button id="open">open</button>
  </div>
  <div class="hint">no one taught these points how to live. their entire world is a single random table of “who attracts whom.” everything else emerges on its own.</div>
</div>

<div class="genome">
  <canvas id="genome" width="6" height="6"></canvas>
  <div class="label">genome · click — mutation</div>
</div>

<div class="controls">
  <button id="reroll">new law</button>
  <button id="pause">pause</button>
</div>

<script>
(() => {
  const telegram = window.Telegram?.WebApp;
  if (telegram) {
    if (telegram.platform && telegram.platform !== 'unknown') {
      document.documentElement.classList.add('telegram-mini-app');
    }
    telegram.ready();
    telegram.expand();
    if (telegram.isVersionAtLeast?.('7.7')) {
      telegram.disableVerticalSwipes();
    }
    if (telegram.isVersionAtLeast?.('8.0')) {
      try { telegram.requestFullscreen(); } catch (_) {}
    }
  }

  // ----- world -----
  const TYPES = 6;            // particle types
  const N = 700;              // total particles
  const R_MAX = 90;           // interaction radius
  const R_MIN_FRAC = 0.28;    // fraction of the radius where repulsion is constant
  const FRICTION = 0.82;
  const FORCE = 0.35;
  const DT = 1;

  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const genomeCanvas = document.getElementById('genome');
  const gctx = genomeCanvas.getContext('2d');
  const seedEl = document.getElementById('seed');

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // deterministic generator — so that every law has a number
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  let seed, rand, matrix, colors;
  const px = new Float32Array(N), py = new Float32Array(N);
  const vx = new Float32Array(N), vy = new Float32Array(N);
  const kind = new Uint8Array(N);

  function makeColors(r) {
    // hues are spread around the color wheel with a random offset — always distinguishable
    const baseHue = Math.floor(r() * 360);
    const out = [];
    for (let i = 0; i < TYPES; i++) {
      const hue = (baseHue + i * (360 / TYPES) + (r() * 20 - 10)) % 360;
      out.push(`hsl(${hue} 70% 62%)`);
    }
    return out;
  }

  function rollUniverse(newSeed) {
    seed = newSeed ?? (Math.random() * 0xFFFFFFFF) >>> 0;
    rand = mulberry32(seed);
    matrix = [];
    for (let i = 0; i < TYPES; i++) {
      matrix.push([]);
      for (let j = 0; j < TYPES; j++) {
        matrix[i].push(rand() * 2 - 1); // from -1 (repels) to +1 (attracts)
      }
    }
    colors = makeColors(rand);
    for (let i = 0; i < N; i++) {
      px[i] = rand() * W;
      py[i] = rand() * H;
      vx[i] = 0;
      vy[i] = 0;
      kind[i] = Math.floor(rand() * TYPES);
    }
    seedEl.textContent = seed.toString(16).padStart(8, '0');
    drawGenome();
  }

  function mutate() {
    // one random cell in the genome changes the course of fate
    const i = Math.floor(Math.random() * TYPES);
    const j = Math.floor(Math.random() * TYPES);
    matrix[i][j] = Math.random() * 2 - 1;
    seedEl.textContent += '*';
    drawGenome();
  }

  function drawGenome() {
    for (let i = 0; i < TYPES; i++) {
      for (let j = 0; j < TYPES; j++) {
        const v = matrix[i][j];
        // warm = attraction, cold = repulsion
        gctx.fillStyle = v > 0
          ? `rgba(255, 160, 90, ${0.15 + 0.85 * v})`
          : `rgba(90, 140, 255, ${0.15 + 0.85 * -v})`;
        gctx.fillRect(j, i, 1, 1);
      }
    }
    const size = Math.min(72, Math.floor(window.innerWidth * 0.15));
    genomeCanvas.style.width = size + 'px';
    genomeCanvas.style.height = size + 'px';
  }

  // ----- physics -----
  // spatial grid to keep the phone from melting
  const CELL = R_MAX;
  let grid = new Map();
  function gridKey(cx, cy) { return cx * 100000 + cy; }

  function step() {
    grid.clear();
    for (let i = 0; i < N; i++) {
      const cx = Math.floor(px[i] / CELL), cy = Math.floor(py[i] / CELL);
      const k = gridKey(cx, cy);
      let bucket = grid.get(k);
      if (!bucket) { bucket = []; grid.set(k, bucket); }
      bucket.push(i);
    }

    const rMin = R_MAX * R_MIN_FRAC;

    for (let i = 0; i < N; i++) {
      let fx = 0, fy = 0;
      const ci = Math.floor(px[i] / CELL), cyi = Math.floor(py[i] / CELL);

      for (let ox = -1; ox <= 1; ox++) {
        for (let oy = -1; oy <= 1; oy++) {
          const bucket = grid.get(gridKey(ci + ox, cyi + oy));
          if (!bucket) continue;
          for (let b = 0; b < bucket.length; b++) {
            const j = bucket[b];
            if (j === i) continue;
            let dx = px[j] - px[i];
            let dy = py[j] - py[i];
            // toroidal world: the edges are joined
            if (dx > W / 2) dx -= W; else if (dx < -W / 2) dx += W;
            if (dy > H / 2) dy -= H; else if (dy < -H / 2) dy += H;
            const d = Math.hypot(dx, dy);
            if (d <= 0 || d >= R_MAX) continue;

            let f;
            if (d < rMin) {
              // personal space: always repulsion
              f = (d / rMin - 1);
            } else {
              const a = matrix[kind[i]][kind[j]];
              // force increases toward the middle of the zone and fades at the edge
              f = a * (1 - Math.abs(2 * d - R_MAX - rMin) / (R_MAX - rMin));
            }
            fx += (dx / d) * f;
            fy += (dy / d) * f;
          }
        }
      }

      vx[i] = vx[i] * FRICTION + fx * FORCE * DT;
      vy[i] = vy[i] * FRICTION + fy * FORCE * DT;
    }

    for (let i = 0; i < N; i++) {
      px[i] += vx[i] * DT;
      py[i] += vy[i] * DT;
      if (px[i] < 0) px[i] += W; else if (px[i] >= W) px[i] -= W;
      if (py[i] < 0) py[i] += H; else if (py[i] >= H) py[i] -= H;
    }
  }

  // ----- rendering -----
  function render() {
    // a faint trail instead of a full clear — movement gains a memory
    ctx.fillStyle = 'rgba(11, 13, 16, 0.35)';
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < N; i++) {
      ctx.fillStyle = colors[kind[i]];
      ctx.fillRect(px[i] - 1.2, py[i] - 1.2, 2.4, 2.4);
    }
  }

  let paused = false;
  function loop() {
    if (!paused) {
      step();
      render();
    }
    requestAnimationFrame(loop);
  }

  // ----- interaction -----
  document.getElementById('reroll').addEventListener('click', () => rollUniverse());

  const seedInput = document.getElementById('seedInput');
  function openBySeed() {
    const raw = seedInput.value.trim().toLowerCase().replace(/^0x/, '');
    if (!/^[0-9a-f]{1,8}$/.test(raw)) {
      seedInput.classList.add('bad');
      setTimeout(() => seedInput.classList.remove('bad'), 900);
      return;
    }
    rollUniverse(parseInt(raw, 16) >>> 0);
    seedInput.value = '';
    seedInput.blur();
  }
  document.getElementById('open').addEventListener('click', openBySeed);
  seedInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') openBySeed();
    e.stopPropagation();
  });
  const pauseBtn = document.getElementById('pause');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'resume' : 'pause';
  });
  genomeCanvas.addEventListener('click', mutate);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      rollUniverse();
    }
  });

  // touching/clicking the world creates a gentle disturbance, like a finger in water
  function stir(x, y) {
    for (let i = 0; i < N; i++) {
      let dx = px[i] - x, dy = py[i] - y;
      const d = Math.hypot(dx, dy);
      if (d < 120 && d > 0) {
        const k = (1 - d / 120) * 6;
        vx[i] += (dx / d) * k;
        vy[i] += (dy / d) * k;
      }
    }
  }
  canvas.addEventListener('pointerdown', e => stir(e.clientX, e.clientY));
  canvas.addEventListener('pointermove', e => { if (e.buttons) stir(e.clientX, e.clientY); });

  rollUniverse();
  loop();
})();
</script>
</body>
</html>
